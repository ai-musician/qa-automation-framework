# Runs on every pull request to main (each new push to the PR runs it again) and on every merge to main.
#
# The API and the tests run in Docker containers (docker-compose.yml): the same commands as on a laptop.
#
#   functional   API + UI tests (`pytest -n auto`: in parallel)        ~1-2 min
#   changes      decides whether the performance tests are needed (see PERF_PATHS below)
#   performance  load + concurrency tests (`pytest -m perf`)           ~1 min
#                only starts if functional passed: no point load-testing a broken build
#                only starts if a performance-relevant file changed: a README or .gitignore edit skips it
#                (manual runs from the Actions tab always include it)
#                pull request: normal load (PERF_LOAD=1), a quick check before merging
#                merge to main: 3x the load (PERF_LOAD=3), on the code that will be deployed
#   kpi          QA KPIs from the two jobs' reports (utils/kpi.py), always runs; reports, never fails the build
#   aws-qa       merges to main (and manual runs): creates a QA environment on AWS from infra/qa-env.yml, runs the
#                API + UI tests against it, deletes it, and checks nothing was left (see README: AWS QA environment)
#   allure       merges to main (and manual runs): builds the Allure report from both test jobs, with history,
#                and publishes it with the KPI dashboard (/kpi/) to GitHub Pages; refuses to publish if a
#                credential made it into either
#
# Reports are attached to each run under "Artifacts"; performance results and KPIs also show on the run's summary page.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:            # "Run workflow" button in the Actions tab

# A new push to the same PR cancels the run still going for the previous push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: API + UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the API and test images
        run: docker compose build

      - name: Run API + UI tests
        run: docker compose run --rm tests

      - name: Show the API's log
        if: failure()
        run: docker compose logs api

      - name: Upload reports (HTML, JUnit, API log, failure screenshots)
        if: always()            # most useful when the tests failed
        uses: actions/upload-artifact@v7
        with:
          name: functional-reports
          path: reports/
          retention-days: 14

  changes:
    name: Check what changed
    runs-on: ubuntu-24.04
    outputs:
      perf: ${{ steps.diff.outputs.perf }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history, so the diff below can see the base commit

      - name: Did a performance-relevant file change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          # pull request: compare with the branch it merges into; push: compare with the previous commit on main
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # the API under test, the load tests and their helpers, test setup, dependencies, the containers, and this pipeline
          PERF_PATHS: '^(mock_server/[^/]*\.py$|tests/perf/|utils/|conftest\.py$|config\.py$|pytest\.ini$|requirements\.txt$|Dockerfile$|docker-compose\.yml$|\.dockerignore$|\.github/workflows/)'
        run: |
          # manual run, or nothing to compare with (first push of a branch): run everything
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "perf=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE "$PERF_PATHS"; then
            echo "perf=true" >> "$GITHUB_OUTPUT"
          else
            echo "perf=false" >> "$GITHUB_OUTPUT"
            echo "Performance tests skipped: no performance-relevant files changed." >> "$GITHUB_STEP_SUMMARY"
          fi

  performance:
    name: Performance tests
    needs: [functional, changes]
    if: needs.changes.outputs.perf == 'true'      # and functional passed (GitHub adds that check by default)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PERF_LOAD: ${{ github.event_name == 'push' && '3' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the API and test images
        run: docker compose build

      - name: Run performance tests (PERF_LOAD=${{ env.PERF_LOAD }})
        run: docker compose run --rm tests pytest -m perf      # PERF_LOAD is passed into the container

      - name: Show the API's log
        if: failure()
        run: docker compose logs api

      - name: Show results on the run page
        if: always()
        run: cat reports/performance.md >> "$GITHUB_STEP_SUMMARY" || echo "No performance results were written."

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: reports/
          retention-days: 30

  kpi:
    name: QA KPIs
    needs: [functional, performance]
    if: always()                  # also when tests failed or performance was skipped: that's what KPIs are for
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read               # the GitHub CLI reads this workflow's recent runs for the pipeline KPIs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # utils/kpi.py uses the standard library only: nothing to install

      - name: Download functional reports
        uses: actions/download-artifact@v8
        continue-on-error: true   # missing if that job didn't get far enough to upload
        with:
          name: functional-reports
          path: reports/functional

      - name: Download performance reports
        if: needs.performance.result == 'success' || needs.performance.result == 'failure'   # not when skipped
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: performance-reports
          path: reports/performance

      - name: Calculate KPIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m utils.kpi --functional reports/functional --perf reports/performance --out reports/kpi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KPI report
        uses: actions/upload-artifact@v7
        with:
          name: kpi-report
          path: reports/kpi/
          retention-days: 90

  allure:
    name: Allure report + KPI dashboard (GitHub Pages)
    needs: [functional, performance, kpi]
    # main only: the report is public. always(): a red run is exactly the one worth looking at
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.functional.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write                # publish to GitHub Pages
      id-token: write             # proves to Pages that this workflow is the publisher
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages                # one publish at a time; never cancel one halfway
      cancel-in-progress: false
    env:
      ALLURE_VERSION: "2.46.1"
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7     # for allure/custom-logo.css

      - name: Download functional results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: functional-reports
          path: reports/functional

      - name: Download performance results
        if: needs.performance.result == 'success' || needs.performance.result == 'failure'   # not when skipped
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: performance-reports
          path: reports/performance

      - name: Collect results, history and run details
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p results/history
          cp reports/functional/allure-results/* results/ 2>/dev/null || true
          cp reports/performance/allure-results/* results/ 2>/dev/null || true

          # history from the report that's live now: this is what fills the trend charts run after run
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$SITE/history/$f" -o "results/history/$f" || echo "no $f yet (first report)"
          done

          # "Executors" widget: links the report back to this CI run
          cat > results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "buildOrder": ${{ github.run_number }},
           "buildName": "run #${{ github.run_number }}", "buildUrl": "$RUN_URL", "reportUrl": "$SITE"}
          EOF

          cat > results/environment.properties <<EOF
          Commit=${GITHUB_SHA::7}
          API=mock fintech API in Docker
          Functional.tests=pytest -n auto (parallel)
          Performance.load=PERF_LOAD=3, one process
          EOF

          # failures sorted the way a triage would: the product is wrong, or the test is
          cat > results/categories.json <<'EOF'
          [{"name": "Product defects", "matchedStatuses": ["failed"]},
           {"name": "Test defects", "matchedStatuses": ["broken"]}]
          EOF

      - name: Download the KPI dashboard
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: kpi-report
          path: reports/kpi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"        # the Allure command-line tool runs on Java

      - name: Build the report
        run: |
          curl -sSfL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz"
          tar xzf allure.tgz
          # our logo instead of Allure's (allure/custom-logo.css), through Allure's own custom-logo plugin
          plugin="allure-$ALLURE_VERSION/plugins/custom-logo-plugin"
          test -d "$plugin/static" || { echo "::error::custom-logo-plugin not found in Allure $ALLURE_VERSION"; exit 1; }
          cp allure/custom-logo.css "$plugin/static/styles.css"
          echo "  - custom-logo-plugin" >> "allure-$ALLURE_VERSION/config/allure.yml"
          "allure-$ALLURE_VERSION/bin/allure" generate results -o site --clean
          # the KPI dashboard (utils/kpi.py) goes next to the report, at /kpi/
          # (kpi.json beside it is what the dashboard's "Export data" button downloads)
          if [ -f reports/kpi/kpi.html ]; then
            mkdir -p site/kpi && cp reports/kpi/kpi.html site/kpi/index.html && cp reports/kpi/kpi.json site/kpi/
          fi

      - name: Check the report shows every test that ran
        run: |
          # Allure merges results it thinks are the same test (as retries); the report must match JUnit exactly
          python3 - <<'EOF'
          import glob, json, sys, xml.etree.ElementTree as ET
          ran = sum(int(s.get("tests", 0)) for f in glob.glob("reports/*/junit.xml")
                    for s in ET.parse(f).getroot().iter("testsuite"))
          shown = json.load(open("site/widgets/summary.json"))["statistic"]["total"]
          print(f"JUnit: {ran} tests ran; Allure report: {shown}")
          if ran != shown:
              print(f"::error::The Allure report shows {shown} tests but {ran} ran; not publishing.")
              sys.exit(1)
          EOF

      - name: Refuse to publish credentials
        run: |
          # the report is public: if a key or token ever got past utils/redact.py, stop here
          if grep -rlF -e user-api-key -e admin-api-key site; then
            echo "::error::A credential was found in the Allure report; not publishing."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the report on the run page
        run: |
          echo "### [Allure report](${{ steps.deploy.outputs.page_url }}) · [KPI dashboard](${{ steps.deploy.outputs.page_url }}kpi/)" >> "$GITHUB_STEP_SUMMARY"

  aws-qa:
    name: Tests on AWS QA environment
    needs: functional               # no point deploying a build that already failed
    # main only: the AWS role trusts main of this repository and nothing else (infra/aws-setup.yml)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write               # GitHub's OIDC token, exchanged for short-lived AWS credentials
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK: qa-env-${{ github.run_id }}-${{ github.run_attempt }}
      INSTANCE_TYPE: t3.micro
      HOURLY_USD: "0.0124"          # on-demand t3.micro, Linux, us-west-1; for the cost estimate only
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate this run's API keys
        run: |
          # new keys for every environment: nothing to store, rotate or leak; masked in every log line
          for name in API_KEY ADMIN_API_KEY; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "RUNNER_IP=$(curl -sSf https://checkip.amazonaws.com)" >> "$GITHUB_ENV"
          echo "CREATED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Create the QA environment
        run: |
          aws cloudformation create-stack --stack-name "$STACK" \
            --template-body file://infra/qa-env.yml \
            --tags Key=project,Value=qa-env \
            --parameters \
              ParameterKey=CommitSha,ParameterValue="$GITHUB_SHA" \
              ParameterKey=RunnerCidr,ParameterValue="$RUNNER_IP/32" \
              ParameterKey=ApiKey,ParameterValue="$API_KEY" \
              ParameterKey=AdminApiKey,ParameterValue="$ADMIN_API_KEY" \
              ParameterKey=InstanceType,ParameterValue="$INSTANCE_TYPE"
          if ! aws cloudformation wait stack-create-complete --stack-name "$STACK"; then
            aws cloudformation describe-stack-events --stack-name "$STACK" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatusReason]' --output text
            exit 1
          fi
          url=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' --output text)
          echo "API_URL=$url" >> "$GITHUB_ENV"
          echo "QA environment: $url"

      - name: Wait for the API
        run: |
          # the instance builds the api image from this commit first: a few minutes
          for i in $(seq 1 60); do
            if curl -sf "$API_URL/" > /dev/null; then echo "API is up after $((i * 10)) s"; exit 0; fi
            sleep 10
          done
          echo "::error::The API on the QA environment didn't answer within 10 minutes"
          exit 1

      - name: Build the test image
        run: docker compose build tests

      - name: Run API + UI tests against the QA environment
        run: |
          # the same test image as every other job; only the address and the keys change (--no-deps: no local API)
          docker compose run --rm --no-deps \
            -e BASE_URL="$API_URL" -e API_BASE_URL="$API_URL" -e API_KEY -e ADMIN_API_KEY \
            tests

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-qa-reports
          path: reports/
          retention-days: 14

      - name: Delete the QA environment
        if: always()                # also when tests failed or the run was cancelled
        run: |
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          echo "DELETED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Check nothing was left running
        if: always()
        run: |
          left=$(aws ec2 describe-instances \
            --filters Name=tag:project,Values=qa-env Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$left" ]; then
            echo "::error::QA environment instances still exist: $left"
            exit 1
          fi
          end=${DELETED_AT:-$(date -u +%s)}
          minutes=$(( (end - ${CREATED_AT:-$end} + 59) / 60 ))
          cost=$(awk -v m="$minutes" -v h="$HOURLY_USD" 'BEGIN { printf "%.4f", m / 60 * h }')
          {
            echo "### AWS QA environment"
            echo "| Stage | |"
            echo "|---|---|"
            echo "| Created | \`$STACK\`: one $INSTANCE_TYPE in $AWS_REGION, port 5050 open to this runner only, keys generated for this run |"
            echo "| Tested | API + UI tests: see the job log and the aws-qa-reports artifact |"
            echo "| Deleted | stack deleted, no instances tagged project=qa-env left |"
            echo "| Lifetime | $minutes min, ≈ \$$cost at on-demand price |"
          } >> "$GITHUB_STEP_SUMMARY"
