# The chaos tests (tests/chaos) as a Job: they stream chat requests to the `inference` Service and stop one of its
# pods partway through. To do that, the Job's service account may list and delete pods, and only in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos
  namespace: qa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos
  namespace: qa
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos
  namespace: qa
subjects:
  - kind: ServiceAccount
    name: chaos
    namespace: qa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chaos
  namespace: qa
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: chaos
      restartPolicy: Never
      containers:
        - name: chaos
          image: qa-tests:local
          imagePullPolicy: Never
          command: [pytest, -m, chaos, tests/chaos, -p, no:cacheprovider]
          env:
            - name: API_BASE_URL
              value: http://inference:5050
            - name: BASE_URL
              value: http://inference:5050
            - name: START_MOCK_SERVER
              value: "false"
          envFrom:
            - secretRef: {name: api-keys}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1Gi}
