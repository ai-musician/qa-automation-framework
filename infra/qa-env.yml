AWSTemplateFormatVersion: "2010-09-09"
Description: >
  On-demand QA environment for one CI run: one small instance that builds and runs this repository's api Docker
  image at the run's commit, reachable on port 5050 from the CI runner's IP address only. CI creates the stack,
  runs the tests against it and deletes it; the instance also terminates itself after MaxLifetimeMinutes in case
  that delete never happens.

Parameters:
  CommitSha:
    Type: String
    AllowedPattern: "[0-9a-f]{40}"
    Description: The exact commit to build, so the QA environment runs the code being tested
  GitHubRepository:
    Type: String
    Default: ai-musician/qa-automation-framework
  RunnerCidr:
    Type: String
    AllowedPattern: "\\d+\\.\\d+\\.\\d+\\.\\d+/32"
    Description: The CI runner's public IP as x.x.x.x/32; the only address allowed to reach the API
  ApiKey:
    Type: String
    NoEcho: true
    Description: The customer API key for this run (generated by CI per run, never stored)
  AdminApiKey:
    Type: String
    NoEcho: true
    Description: The admin API key for this run (generated by CI per run, never stored)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023, looked up when the stack is created
  MaxLifetimeMinutes:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 180
    Description: Safety net. The instance shuts down and terminates itself after this long, whatever CI does.

Resources:
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: QA API, reachable from the CI runner only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5050
          ToPort: 5050
          CidrIp: !Ref RunnerCidr
          Description: the GitHub Actions runner of this run
      Tags:
        - {Key: project, Value: qa-env}

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      SecurityGroupIds: [!GetAtt ApiSecurityGroup.GroupId]
      InstanceInitiatedShutdownBehavior: terminate      # "shutdown" below then deletes the instance, not just stops it
      MetadataOptions:
        HttpTokens: required                            # IMDSv2 only
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - {Key: project, Value: qa-env}
        - {Key: Name, Value: !Sub "qa-env ${AWS::StackName}"}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          # safety net: terminate after MaxLifetimeMinutes even if CI never deletes this stack
          shutdown -h +${MaxLifetimeMinutes}

          dnf install -y docker git
          systemctl start docker

          # build the api image from the exact commit CI is testing: the same Dockerfile as locally and in CI
          mkdir /app && cd /app
          git init -q
          git remote add origin https://github.com/${GitHubRepository}.git
          git fetch -q --depth 1 origin ${CommitSha}
          git checkout -q FETCH_HEAD
          docker build --target api -t qa-api .

          docker run -d --restart unless-stopped -p 5050:5050 \
            -e API_KEY='${ApiKey}' -e ADMIN_API_KEY='${AdminApiKey}' qa-api

Outputs:
  ApiUrl:
    Description: Base URL of the QA API
    Value: !Sub http://${ApiInstance.PublicIp}:5050
  InstanceId:
    Value: !Ref ApiInstance
