[pytest]
testpaths = tests
addopts =
    -v
    -m "not perf"
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
    --alluredir=reports/allure-results
    --screenshot=only-on-failure
    --output=reports/artifacts
log_level = INFO
log_format = %(message)s
log_file = reports/api.log
log_file_level = INFO
markers =
    api: API-level tests (requests)
    ui: browser tests (playwright)
    auth: authentication / authorization
    negative: error and validation scenarios
    perf: performance and concurrency tests (not run by default; pytest -m perf)